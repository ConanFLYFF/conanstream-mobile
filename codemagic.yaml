workflows:
  build-and-release:
    name: Build and Auto-Release (Android & Windows)
    max_build_duration: 60
    instance_type: windows_x2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    environment:
      groups:
        - github
      flutter: stable

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      # 1. Compilation APK Android
      - name: Build APK Release avec versioning automatique
        script: |
          flutter build apk --release `
            --build-number=$env:BUILD_NUMBER `
            --build-name="1.0.$env:BUILD_NUMBER" `
            --obfuscate `
            --split-debug-info=build/app/outputs/symbols `
            --android-skip-build-dependency-validation

      # 2. Compilation Exécutable Windows
      - name: Build Windows App
        script: flutter build windows --release

      # 3. Création de l'installeur Windows .exe avec Inno Setup
      - name: Generer l'installeur Windows .exe
        script: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer_script.iss

      # 4. Publication de la Release sur GitHub & mise à jour du version.json
      - name: Publier la Release sur GitHub et mettre a jour version.json
        script: |
          if (-not $env:GH_TOKEN) {
            Write-Error "ERREUR : GH_TOKEN manque dans l'environnement !"
            exit 1
          }

          choco install gh -y
          echo $env:GH_TOKEN | gh auth login --with-token

          gh release create "v1.0.$env:BUILD_NUMBER" `
            "build/app/outputs/flutter-apk/app-release.apk" `
            "conanstream-windows.exe" `
            --title "Release v1.0.$env:BUILD_NUMBER" `
            --notes "Mise a jour automatique (Build #$env:BUILD_NUMBER)"

          $versionJson = @"
          {
            "versionCode": $env:BUILD_NUMBER,
            "versionName": "1.0.$env:BUILD_NUMBER",
            "apkUrl": "https://github.com/ConanFLYFF/conanstream-mobile/releases/download/v1.0.$env:BUILD_NUMBER/app-release.apk",
            "exeUrl": "https://github.com/ConanFLYFF/conanstream-mobile/releases/download/v1.0.$env:BUILD_NUMBER/conanstream-windows.exe",
            "releaseNotes": "Mise a jour automatique (Build #$env:BUILD_NUMBER)"
          }
          "@
          Set-Content -Path "version.json" -Value $versionJson

          git config --global user.name "Codemagic Bot"
          git config --global user.email "bot@codemagic.io"
          git add version.json
          git commit -m "Auto-update version.json [Build #$env:BUILD_NUMBER] [skip ci]"
          git push https://$($env:GH_TOKEN)@github.com/ConanFLYFF/conanstream-mobile.git HEAD:main

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - conanstream-windows.exe

  ios-workflow:
    name: iOS Release Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS App
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app