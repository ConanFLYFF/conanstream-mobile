workflows:
  android-workflow:
    name: Android Release Workflow
    max_build_duration: 30
    environment:
      groups:
        - github
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK Release avec versioning automatique
        script: |
          flutter build apk --release \
            --build-number=$BUILD_NUMBER \
            --build-name=1.0.$BUILD_NUMBER \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --android-skip-build-dependency-validation
      - name: Générer et publier version.json sur GitHub
        script: |
          # 1. Vérification que le token est bien injecté par Codemagic
          if [ -z "$GH_TOKEN" ]; then
            echo "ERREUR : GH_TOKEN est vide ou non injecté par Codemagic !"
            exit 1
          else
            echo "GH_TOKEN bien détecté (longueur : ${#GH_TOKEN})"
          fi

          # 2. Génération du fichier version.json
          cat <<EOF > version.json
          {
            "versionCode": $BUILD_NUMBER,
            "versionName": "1.0.$BUILD_NUMBER",
            "apkUrl": "https://github.com/ConanFLYFF/conanstream-mobile/releases/download/v1.0.$BUILD_NUMBER/app-release.apk",
            "exeUrl": "https://github.com/ConanFLYFF/conanstream-mobile/releases/download/v1.0.$BUILD_NUMBER/conanstream-windows.exe",
            "releaseNotes": "Mise à jour automatique (Build #$BUILD_NUMBER)"
          }
          EOF

          # 3. Configuration Git
          git config --global user.name "Codemagic Bot"
          git config --global user.email "bot@codemagic.io"
          git add version.json
          git commit -m "Auto-update version.json [Build #$BUILD_NUMBER] [skip ci]" || true

          # 4. Push direct sécurisé avec le GH_TOKEN
          git push https://$GH_TOKEN@github.com/ConanFLYFF/conanstream-mobile.git HEAD:main
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

  ios-workflow:
    name: iOS Release Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS App
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app