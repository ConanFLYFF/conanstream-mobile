workflows:
  android-workflow:
    name: Android Release Workflow
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build APK Release avec versioning automatique
        script: |
          flutter build apk --release \
            --build-number=$BUILD_NUMBER \
            --build-name=1.0.$BUILD_NUMBER \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --android-skip-build-dependency-validation
      - name: Générer et publier version.json sur GitHub
        script: |
          # Génération du fichier version.json compatible Android & Windows
          cat <<EOF > version.json
          {
            "versionCode": $BUILD_NUMBER,
            "versionName": "1.0.$BUILD_NUMBER",
            "apkUrl": "https://github.com/ConanFLYFF/conanstream-mobile/releases/download/v1.0.$BUILD_NUMBER/app-release.apk",
            "exeUrl": "https://github.com/ConanFLYFF/conanstream-mobile/releases/download/v1.0.$BUILD_NUMBER/conanstream-windows.exe",
            "releaseNotes": "Mise à jour automatique (Build #$BUILD_NUMBER)"
          }
          EOF

          # Envoi automatique sur GitHub
          git config --global user.name "Codemagic Bot"
          git config --global user.email "bot@codemagic.io"
          git add version.json
          git commit -m "Auto-update version.json [Build #$BUILD_NUMBER] [skip ci]" || true
          git push origin main
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

  ios-workflow:
    name: iOS Release Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build iOS App
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app