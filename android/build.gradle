buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Compatibilité AGP et Kotlin
        classpath 'com.android.tools.build:gradle:7.3.1'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.0'
    }
    // Intercepte et force la version de Kotlin au niveau du buildscript pour tous les plugins
    configurations.classpath {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion '2.2.0'
            }
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Stratégie globale pour forcer la version de Kotlin sur l'ensemble des sous-projets
subprojects {
    project.configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                details.useVersion '2.2.0'
            }
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Correctif du namespace pour install_plugin_v2
subprojects {
    plugins.withId('com.android.library') {
        if (project.name == 'install_plugin_v2') {
            project.android {
                if (namespace == null) {
                    namespace 'com.zaihui.installplugin'
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}