buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Compatibilité AGP et Kotlin
        classpath 'com.android.tools.build:gradle:7.3.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Correctif du namespace pour install_plugin_v2 sans erreur d'évaluation Gradle
subprojects {
    plugins.withId('com.android.library') {
        if (project.name == 'install_plugin_v2') {
            project.android {
                if (namespace == null) {
                    namespace 'com.zaihui.installplugin'
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}